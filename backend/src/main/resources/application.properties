spring.application.name=linkshifter-backend
server.port=${PORT:8080}

# H2 for local development (default profile)
spring.datasource.url=jdbc:h2:file:./data/linkshifter;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS & App URLs
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.base.url=${APP_BASE_URL:http://localhost:8080}
